<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101828">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitLab">
<title>FitLab</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F0E9; --paper:#FFFFFF; --ink:#101828; --ink2:#454E5E; --ink3:#8A8F99; --line:#DDD8CC;
  --blue:#8A6A1F; --blue-soft:#F1E8CF; --orange:#9C5A2B; --orange-soft:#F4E2D3;
  --green:#2E7D5B; --green-soft:#DDEFE5; --amber:#B0841C; --amber-soft:#F6EBCC; --red:#B33A3A; --red-soft:#F5DCDC;
  --gold:#C9A652;
  --r:14px; --rs:8px; --tap:48px;
  --display:"Lora","Georgia","Times New Roman",serif;
  --body:"Poppins","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1626;--paper:#171F33;--ink:#F1ECE0;--ink2:#C2BDB0;--ink3:#7F8697;--line:#2A3348;
    --blue:#D4B15A;--blue-soft:#2B2A24;--orange:#E39B63;--orange-soft:#3A2A1E;--green:#4FBF8B;--green-soft:#1B3A2C;
    --amber:#E0B84A;--amber-soft:#3E3416;--red:#E96060;--red-soft:#432121;--gold:#D4B15A;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3,.disp{font-family:var(--display);font-weight:600;letter-spacing:.005em;line-height:1.1;margin:0}
h1{font-size:34px}h2{font-size:24px}h3{font-size:18px}
p{margin:0 0 8px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;min-height:var(--tap);border-radius:var(--r);padding:0 18px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;min-height:var(--tap);width:100%}
main{max-width:640px;margin:0 auto;padding:14px 16px 24px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:6px 0 16px}
.top small{color:var(--ink3)}
.card{background:var(--paper);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.flat{background:none;padding:0}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1}
.muted{color:var(--ink3)}.sub{color:var(--ink2)}
.small{font-size:13px}
.btn{background:var(--ink);color:var(--bg);font-family:var(--display);font-size:18px;font-weight:600;width:100%;min-height:56px}
.btn.blue{background:var(--ink);color:var(--gold)}.btn.orange{background:var(--gold);color:#101828}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{min-height:var(--tap);font-size:16px;width:auto;white-space:nowrap}
.btn:disabled{opacity:.45}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;background:var(--blue-soft);color:var(--blue);font-weight:600}
.pill.g{background:var(--green-soft);color:var(--green)}.pill.a{background:var(--amber-soft);color:var(--amber)}.pill.r{background:var(--red-soft);color:var(--red)}.pill.o{background:var(--orange-soft);color:var(--orange)}.pill.n{background:var(--bg);color:var(--ink2)}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;color:var(--ink3);border-radius:10px;min-height:56px}
nav.tabs button.on{color:var(--blue)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0 14px}
.week div{text-align:center;padding:8px 0 6px;border-radius:10px;background:var(--paper);font-size:12px;color:var(--ink3)}
.week div b{display:block;font-family:var(--display);font-size:18px;color:var(--ink);font-weight:600}
.week div.today{outline:2px solid var(--gold)}
.week div.done{background:var(--green-soft)}.week div.done b{color:var(--green)}
.week div.planned{background:var(--blue-soft)}
/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--paper);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:64px}
.item .thumb{width:56px;height:56px;border-radius:10px;background:var(--bg);object-fit:cover;flex:none}
.item .t{font-family:var(--display);font-size:18px;font-weight:600}
.item .d{font-size:13px;color:var(--ink3)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px;background:var(--paper)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* exercise detail */
.hero{display:grid;grid-template-columns:1fr 120px;gap:12px;align-items:start}
.flip{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--paper)}
.flip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s}
.flip .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:14px;padding:16px;text-align:center}
.cues{counter-reset:c;list-style:none;padding:0;margin:12px 0}
.cues li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:17px}
.cues li::before{counter-increment:c;content:counter(c);font-family:var(--display);font-weight:600;font-size:22px;color:var(--gold);min-width:22px;line-height:1}
.watch{background:var(--orange-soft);border-left:4px solid var(--orange);border-radius:var(--rs);padding:10px 12px;margin:8px 0}
details{border-top:1px solid var(--line);padding:10px 0}
details summary{font-family:var(--display);font-size:18px;font-weight:600;cursor:pointer;min-height:36px;display:flex;align-items:center}
details ul{margin:6px 0 0;padding-left:18px}
details li{margin:4px 0}
.muscle svg{width:100%;height:auto}
.muscle .m{fill:var(--line);stroke:var(--paper);stroke-width:1}
.muscle .p{fill:var(--gold)}.muscle .s{fill:var(--blue);opacity:.4}
/* gym mode */
.gym{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;overflow:hidden}
.gym .head{padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
.gym .body{flex:1;overflow:auto;padding:0 16px 12px;max-width:640px;width:100%;margin:0 auto}
.gym .foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line)}
.gym .foot .inner{max-width:640px;margin:0 auto}
.setrow{display:grid;grid-template-columns:36px 1fr 1fr 56px;gap:8px;align-items:center;margin:6px 0}
.setrow .n{font-family:var(--display);font-size:20px;font-weight:600;color:var(--ink3);text-align:center}
.step{display:grid;grid-template-columns:40px 1fr 40px;background:var(--paper);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.step button{min-height:var(--tap);padding:0;font-size:22px;color:var(--ink2);border-radius:0}
.step input{border:0;text-align:center;font-family:var(--display);font-size:20px;font-weight:600;padding:0;min-height:var(--tap);background:none;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{display:none}
.setrow .ok{min-height:var(--tap);padding:0;border-radius:10px;background:var(--paper);border:1px solid var(--line);font-size:20px}
.setrow .ok.done{background:var(--green);color:#fff;border-color:var(--green)}
.timer{font-family:var(--display);font-size:56px;font-weight:600;text-align:center;line-height:1;padding:8px 0}
.timer.go{color:var(--orange)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);transition:width .3s}
.suggest{background:var(--blue-soft);color:var(--blue);border-radius:var(--rs);padding:8px 12px;font-size:14px;margin:6px 0}
/* plan */
.day{background:var(--paper);border-radius:var(--r);padding:14px;margin-bottom:10px}
.day h3{display:flex;justify-content:space-between;align-items:baseline}
.slot{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:flex-start}
.slot .sr{font-family:var(--display);font-weight:600;min-width:60px;color:var(--blue)}
.slot .why{font-size:13px;color:var(--ink3)}
.bar{display:grid;grid-template-columns:90px 1fr 46px;gap:8px;align-items:center;margin:5px 0;font-size:14px}
.bar .tr{height:10px;background:var(--line);border-radius:5px;overflow:hidden;position:relative}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bar .tr .lo,.bar .tr .hi{position:absolute;top:-2px;bottom:-2px;width:1.5px;background:var(--ink3)}
canvas{width:100%;height:180px;display:block}
.q{margin-bottom:16px}
.q label{display:block;font-family:var(--display);font-size:18px;font-weight:600;margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:40;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--paper);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:600}
.stat span{font-size:13px;color:var(--ink3)}
.verdict{border-radius:var(--r);padding:14px;margin-bottom:12px}
.verdict.g{background:var(--green-soft)}.verdict.a{background:var(--amber-soft)}.verdict.n{background:var(--paper)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="view"></main>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast"></div>
<script>
/* ===================== DATA ===================== */
const IMG = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';
const MUSCLES = {chest:'Chest',front_delt:'Front delts',side_delt:'Side delts',rear_delt:'Rear delts',biceps:'Biceps',triceps:'Triceps',forearms:'Forearms',abs:'Abs',obliques:'Obliques',lats:'Lats',upper_back:'Upper back',lower_back:'Lower back',traps:'Traps',quads:'Quads',hamstrings:'Hamstrings',glutes:'Glutes',calves:'Calves',abductors:'Abductors',serratus:'Serratus'};
// Landmarks: approximate weekly hard-set ranges for growth (sets counted 1.0 primary, 0.5 secondary)
const LANDMARK = {chest:[10,20],front_delt:[6,14],side_delt:[8,20],rear_delt:[6,16],biceps:[8,18],triceps:[8,18],forearms:[0,10],abs:[6,16],obliques:[0,10],lats:[10,20],upper_back:[8,18],lower_back:[4,12],traps:[0,12],quads:[8,18],hamstrings:[6,16],glutes:[6,18],calves:[6,16],abductors:[0,10],serratus:[0,8]};
const REST = {compound:150,accessory:105,isolation:75,core:60,cardio:0};
/* Each exercise: id, name, es, img (free-exercise-db id), pattern, equip[], cls, primary[], secondary[], tempo, cues[3], setup[], why[], watch[], mistakes[], swaps[{id,reason}], inc (kg step) */
const EX = [
{id:'incline_db_press',name:'Incline Dumbbell Press',es:'Press inclinado con mancuernas',img:'Incline_Dumbbell_Press',pattern:'push_incline',equip:['dumbbell','bench'],cls:'compound',primary:['chest','front_delt'],secondary:['triceps'],tempo:'3-1-1',inc:2,
 setup:['Bench at 30°, feet planted, slight arch, shoulder blades pulled back and down.','Kick the dumbbells up with your knees; start at the top with arms extended.'],
 cues:['Elbows about 45° from the torso, not flared to 90°.','Lower for a slow 3 count until the dumbbells reach chest level.','Drive up and slightly inward, as if closing a book.'],
 why:['Builds the upper chest, which makes the chest look "square" and full from the collarbone down: the signature of an athletic, defined look.','Dumbbells let each shoulder move on its own path, which is easier on the joints than a fixed bar.'],
 watch:['Shoulder pinching at the bottom means the elbows are flared. Tuck them and shorten the range slightly.','Do not bounce out of the bottom: the stretched position under load is where pec strains happen.'],
 mistakes:['Bench too steep (45°+) shifts the work to the front delts. Stay at 30°.','Losing the shoulder-blade set: shoulders roll forward and the chest stops working.'],
 swaps:[{id:'incline_smith',reason:'Bench busy / shoulder feels unstable'},{id:'machine_incline_press',reason:'Joint-friendly, fixed path'}]},
{id:'db_pullover',name:'Dumbbell Pullover',es:'Pull-over con mancuerna',img:'Bent-Arm_Dumbbell_Pullover',pattern:'pullover',equip:['dumbbell','bench'],cls:'accessory',primary:['chest','lats'],secondary:['triceps','serratus'],tempo:'3-1-2',inc:2,
 setup:['Lie across or along a flat bench, hips slightly below shoulders.','Hold one dumbbell with both palms under the top plate, arms slightly bent.'],
 cues:['Keep the elbow bend fixed; the movement happens at the shoulder only.','Lower until you feel a deep stretch through the chest and lats, no further.','Pull back over the chest by driving the upper arms, not by bending the elbows.'],
 why:['One of the few movements that stretches the chest and lats through their full length; great for a "wide" upper body look.','Trains the serratus, the finger-like muscles beside the ribs that show when lean.'],
 watch:['Shoulder history? Reduce the range and go light. The bottom position puts the shoulder at end range.','Keep the ribs down; arching the lower back turns this into a spine exercise.'],
 mistakes:['Using too much weight and turning it into a triceps extension.','Rushing the stretch: the lengthened position is where this exercise pays off.'],
 swaps:[{id:'cable_pullover',reason:'Constant tension, easier on the shoulder'}]},
{id:'seated_db_ohp',name:'Seated Dumbbell Overhead Press',es:'Press militar sentado con mancuernas',img:'Dumbbell_Shoulder_Press',pattern:'push_vertical',equip:['dumbbell','bench'],cls:'compound',primary:['front_delt','side_delt'],secondary:['triceps','traps'],tempo:'2-0-1',inc:2,
 setup:['Bench upright or one notch back (80–85°). Feet wide, ribs down, glutes tight.','Start with dumbbells at ear height, palms forward or slightly turned in.'],
 cues:['Press up and slightly in so the dumbbells finish over the middle of your head.','Do not let the lower back arch; the core stays braced the whole set.','Lower to ear height, not to the shoulders, to keep tension on.'],
 why:['The main builder of round, capped shoulders, the width that creates a V-taper.','Seated removes leg drive so the shoulders do all the work.'],
 watch:['Pain at the front of the shoulder: turn palms slightly toward each other (neutral grip) and stop at ear level.','Neck strain: look forward, not up.'],
 mistakes:['Leaning back into an incline bench press.','Flaring elbows straight out to the sides at the bottom.'],
 swaps:[{id:'machine_shoulder_press',reason:'Fixed path, less stabiliser fatigue'},{id:'arnold_press',reason:'More side-delt involvement'}]},
{id:'cable_crossover',name:'Cable Crossover',es:'Cruce de poleas',img:'Cable_Crossover',pattern:'chest_fly',equip:['cable'],cls:'isolation',primary:['chest'],secondary:['front_delt'],tempo:'2-1-2',inc:2.5,
 setup:['Pulleys at shoulder height or slightly above. Step forward into a staggered stance.','Slight bend in the elbows, chest up, shoulders back.'],
 cues:['Bring the hands together in a wide arc, like hugging a tree.','Squeeze the chest for a full second at the front.','Let the arms open slowly until you feel the stretch across the chest.'],
 why:['Constant tension through the whole range, especially at the squeeze where the press gives nothing.','Trains the chest to contract fully across the body, giving the inner-chest line definition.'],
 watch:['Do not let the shoulders roll forward at the front; keep them pinned back.','Stop the stretch when the hands are level with the shoulders, not behind.'],
 mistakes:['Bending the elbows to push the weight, turning it into a press.','Going too heavy and using body sway.'],
 swaps:[{id:'pec_deck',reason:'Machine busy / want a fixed path'}]},
{id:'pec_deck',name:'Pec Deck',es:'Contractor de pecho',img:'Butterfly',pattern:'chest_fly',equip:['machine'],cls:'isolation',primary:['chest'],secondary:['front_delt'],tempo:'2-1-2',inc:2.5,
 setup:['Seat height so the handles are at mid-chest. Back flat on the pad.','Slight elbow bend, forearms roughly parallel to the floor.'],
 cues:['Drive with the inside of the elbows, not the hands.','Hold the squeeze for a full second in front of the chest.','Open slowly; stop where the chest is stretched, not the shoulder.'],
 why:['Fixed path means all effort goes to the chest; ideal as a finisher when the shoulders are tired.','Safe to take to failure because there is nothing to drop.'],
 watch:['Set the range limiter so the pads do not go behind the body line.'],
 mistakes:['Shrugging the shoulders up during the squeeze.'],
 swaps:[{id:'cable_crossover',reason:'Cables free'}]},
{id:'cable_lateral',name:'Cable Lateral Raise',es:'Elevación lateral en polea',img:'Cable_Seated_Lateral_Raise',pattern:'lateral',equip:['cable'],cls:'isolation',primary:['side_delt'],secondary:['traps'],tempo:'2-1-2',inc:1.25,
 setup:['Pulley at its lowest or ankle height, cable across the body. Stand tall with a slight lean away.','Soft grip or use a wrist strap to take the forearm out of it.'],
 cues:['Lead with the elbow, hand follows; raise to shoulder height only.','Pinky slightly higher than the thumb at the top.','Lower for 2 counts and keep tension at the bottom, no resting.'],
 why:['The side delt is the muscle that makes shoulders look wide; cables load it at the bottom where dumbbells give nothing.','High reps with light load: joint-friendly volume for a muscle that responds to lots of it.'],
 watch:['Shrugging means the traps are taking over; drop the weight and pin the shoulders down.','Do not go above shoulder height; it adds nothing and irritates the joint.'],
 mistakes:['Swinging the torso to start the rep.','Gripping hard: the forearms fatigue before the delt.'],
 swaps:[{id:'db_lateral',reason:'Cable busy'}]},
{id:'db_lateral',name:'Dumbbell Lateral Raise',es:'Elevación lateral con mancuernas',img:'Side_Lateral_Raise',pattern:'lateral',equip:['dumbbell'],cls:'isolation',primary:['side_delt'],secondary:['traps'],tempo:'2-1-2',inc:1,
 setup:['Stand tall, slight forward lean, dumbbells beside (not in front of) the thighs.'],
 cues:['Elbows lead, raise out to the sides to shoulder height.','Tilt the dumbbell so the pinky is slightly higher at the top.','Lower for 2 counts; do not let the dumbbells touch the thighs.'],
 why:['The classic side-delt builder; easy to do anywhere and easy to push to failure safely.'],
 watch:['Above shoulder height the traps and joint take over. Stop at the shoulder line.'],
 mistakes:['Heaving with the hips. If you need momentum, the weight is too heavy.'],
 swaps:[{id:'cable_lateral',reason:'Want constant tension'}]},
{id:'rope_pushdown',name:'Triceps Rope Pushdown',es:'Extensión de tríceps con cuerda',img:'Triceps_Pushdown_-_Rope_Attachment',pattern:'triceps',equip:['cable'],cls:'isolation',primary:['triceps'],secondary:[],tempo:'2-1-2',inc:2.5,
 setup:['High pulley, rope attachment. Elbows pinned to the sides, slight forward lean.'],
 cues:['Push down and pull the rope ends apart at the bottom.','Squeeze the triceps hard for a second with the arms straight.','Let the forearms come up to about 90° and no further; elbows stay glued.'],
 why:['Isolates the lateral head of the triceps, the "horseshoe" that shows on the outside of the arm.','Cable tension means the muscle works through the full rep, and it is kind to the elbows.'],
 watch:['Elbow pain: reduce the range at the top and use a lighter load with a slower tempo.'],
 mistakes:['Elbows drifting forward and up: this turns it into a lat exercise.'],
 swaps:[{id:'overhead_rope',reason:'Hit the long head instead'}]},
{id:'overhead_rope',name:'Overhead Triceps Extension (Rope)',es:'Extensión de tríceps sobre la cabeza',img:'Cable_Rope_Overhead_Triceps_Extension',pattern:'triceps_overhead',equip:['cable'],cls:'isolation',primary:['triceps'],secondary:[],tempo:'3-0-2',inc:2.5,
 setup:['Low or mid pulley, rope. Face away, staggered stance, lean forward, upper arms beside the head.'],
 cues:['Extend until the arms are straight, elbows pointing forward the whole time.','Lower slowly for a 3 count into a deep stretch behind the head.','Keep the ribs down and the core braced.'],
 why:['The long head of the triceps only gets fully stretched with the arm overhead; this is where most arm size comes from.','Stretch-loaded reps drive growth with less weight than pressing.'],
 watch:['Elbow or shoulder discomfort: reduce the stretch and warm up with a lighter set first.'],
 mistakes:['Elbows flaring outward as the load increases.'],
 swaps:[{id:'rope_pushdown',reason:'Overhead bothers the shoulder'}]},
{id:'captains_chair',name:"Captain's Chair Leg Raise",es:'Elevación de piernas en silla romana',img:'Hanging_Leg_Raise',pattern:'core_flex',equip:['bodyweight'],cls:'core',primary:['abs'],secondary:['obliques'],tempo:'2-1-2',inc:0,
 setup:['Forearms on the pads, back against the rest, shoulders down away from the ears.'],
 cues:['Tilt the pelvis up first, then raise the knees; the lower abs start the movement.','Pause at the top with the hips slightly curled.','Lower under control, do not swing.'],
 why:['Trains the lower abs with hip flexion plus a pelvic tilt, the part most crunches miss.','Bodyweight core work that is easy to progress: knees bent, then straight legs, then slower.'],
 watch:['Lower back pain means the hip flexors are dominating; shorten the range and add the pelvic tilt.'],
 mistakes:['Shrugging into the pads.','Swinging to generate momentum.'],
 swaps:[{id:'lying_leg_raise',reason:'No chair available'}]},
{id:'lying_leg_raise',name:'Lying Leg Raise',es:'Elevación de piernas tumbado',img:'Flat_Bench_Lying_Leg_Raise',pattern:'core_flex',equip:['bodyweight','bench'],cls:'core',primary:['abs'],secondary:[],tempo:'2-1-2',inc:0,
 setup:['Lie flat, hands under the hips or holding the bench behind the head.'],
 cues:['Press the lower back into the bench before you move.','Raise the legs to vertical, curling the hips slightly at the top.','Lower slowly; stop before the back arches.'],
 why:['Simple, scalable lower-ab work with no equipment.'],
 watch:['Keep the back flat the whole time; bend the knees if it arches.'],

/* ===================== ENGINE ===================== */
function pick(slotKey,equip,jointMode){
 const sl=SLOT[slotKey];for(const id of sl.p){const e=EXI[id];if(e.equip.every(q=>equip.includes(q)||q==='bench'))return e;}
 return EXI[sl.p[sl.p.length-1]];
}
function generate(o){
 const tpl=TEMPLATES[o.days]||TEMPLATES[4];
 const cut=o.minutes<50?2:o.minutes<65?1:0;  // trim isolation slots when short on time
 const days=tpl.map(d=>{
  if(d.rest&&!d.slots)return {name:d.name,rest:true,focus:d.focus||'Full recovery',slots:[]};
  let keys=[...d.slots];
  if(cut&&!d.rest){let n=cut;for(let i=keys.length-1;i>=0&&n>0;i--){const cls=EXI[SLOT[keys[i]].p[0]].cls;if(cls==='isolation'||cls==='core'){keys.splice(i,1);n--;}}}
  const slots=keys.map(k=>{const e=pick(k,o.equip,o.jointMode);const sl=SLOT[k];let sets=sl.sets,reps=sl.reps;
   if(o.goal==='strength'&&e.cls==='compound'){reps='5-6';sets=Math.max(4,sets);}
   if(o.goal==='recomp'&&e.cls==='isolation'){reps=reps==='15-20'?'15-20':'12-15';}
   if(o.priority&&e.primary.includes(o.priority)&&e.cls!=='cardio')sets+=1;
   return {ex:e.id,sets,reps,why:sl.why};});
  return {name:d.name,rest:!!d.rest,focus:d.focus||'',slots};
 });
 const names={aesthetic:'Aesthetic',strength:'Strength',recomp:'Recomp'};
 return {id:'p'+Date.now(),name:`${names[o.goal]||'Custom'} ${o.days}-day`,goal:o.goal,minutes:o.minutes,days};
}
function audit(p){
 const sets={},freq={};Object.keys(MUSCLES).forEach(m=>{sets[m]=0;freq[m]=0});
 p.days.forEach(d=>{const hit=new Set();d.slots.forEach(s=>{const e=EXI[s.ex];if(!e||e.cls==='cardio')return;e.primary.forEach(m=>{sets[m]+=s.sets;hit.add(m)});e.secondary.forEach(m=>sets[m]+=s.sets*0.5);});hit.forEach(m=>freq[m]++);});
 return Object.keys(MUSCLES).filter(m=>LANDMARK[m][0]>0||sets[m]>0).map(m=>{const [lo,hi]=LANDMARK[m];const v=Math.round(sets[m]*2)/2;
  const st=v<lo?'r':v>hi?'a':'g';return {m,v,lo,hi,freq:freq[m],st};});
}
function suggest(e,slot){
 const L=lastEntry(e.id);if(!L)return {sets:[],text:'First time: pick a load you could do for 2–3 more reps than the target (RIR 2–3).'};
 const done=L.en.sets.filter(s=>s.done);const hi=repHi(slot.reps),lo=repLo(slot.reps);
 const daysOff=(Date.now()-new Date(L.date))/864e5;
 let w=done[0]?.w||0;let text='Same as last time: '+w+' '+unit()+' × '+done.map(s=>s.r).join('/');
 if(daysOff>=10&&w>0){w=Math.round(w*0.9/ (e.inc||1))*(e.inc||1);text=`${Math.round(daysOff)} days off: start at −10% (${w} ${unit()}) and ramp back over two sessions.`;}
 else if(hi&&done.length&&done.every(s=>s.r>=hi&&(s.rir??2)<=2)){w=w+(e.inc||2.5);text=`You hit ${hi} on every set last time. Add weight: ${w} ${unit()}.`;}
 else if(lo&&done.length&&done.every(s=>s.r<lo)){text=`Under ${lo} reps last time. Keep ${w} ${unit()}, aim to add a rep per set. Third miss in a row: drop 5% or swap.`;}
 else if(hi&&done.length){text=`Keep ${w} ${unit()} and push toward ${hi} reps on every set.`;}
 return {sets:done.map(s=>({w,r:s.r})),text,w};
}
function verdict(){
 const cut=Date.now()-28*864e5;const recent=S.sessions.filter(s=>new Date(s.date)>cut);
 if(recent.length<4)return {cls:'n',title:'Not enough data yet',text:`${recent.length} session${recent.length===1?'':'s'} in the last 4 weeks. After 4+ sessions FitLab will tell you whether training is working.`};
 const byEx={};S.sessions.forEach(s=>s.entries.forEach(en=>{const best=Math.max(0,...en.sets.filter(x=>x.done&&x.w>0).map(x=>e1rm(x.w,x.r)));if(best)(byEx[en.ex]=byEx[en.ex]||[]).push({d:s.date,v:best});}));
 let up=0,hold=0,down=0;Object.values(byEx).forEach(a=>{if(a.length<2)return;const first=a[0].v,last=a[a.length-1].v;const ch=(last-first)/first;if(ch>0.02)up++;else if(ch<-0.03)down++;else hold++;});
 const bf=S.body.filter(b=>b.bf).sort((a,b)=>a.d<b.d?-1:1);const bfDrop=bf.length>=4?bf[0].bf-bf[bf.length-1].bf:null;
 const vol=recent.reduce((a,s)=>a+s.entries.reduce((b,en)=>b+en.sets.filter(x=>x.done).length,0),0);
 if(down>up)return {cls:'a',title:'Strength is slipping',text:`${down} lifts trending down vs ${up} up. In a deficit that usually means too little food, sleep or a deload is due. ${S.lastDeload?'':'You have not logged a deload yet.'}`};
 if(bfDrop!==null&&bfDrop>0&&up+hold>=down)return {cls:'g',title:'Recomp is working',text:`Body fat down ${bfDrop.toFixed(1)} pts while ${up} lifts went up and ${hold} held. Holding strength while leaning out is exactly the goal.`};
 if(up>0)return {cls:'g',title:'Training is working',text:`${up} lifts up, ${hold} holding, ${down} down over ${recent.length} sessions (${vol} hard sets). Keep the progression rules going.`};
 return {cls:'a',title:'Holding steady',text:`Most lifts are flat over ${recent.length} sessions. Check that you are pushing to RIR 1–2 and hitting the top of the rep range before adding load.`};
}

 $('#tabs').innerHTML=TABS.map(t=>`<button class="${route.v===t[0]||(route.v==='exercise'&&t[0]==='library')||(route.v==='builder'&&t[0]==='plan')?'on':''}" onclick="go('${t[0]}')" aria-label="${t[1]}"><svg viewBox="0 0 24 24">${t[2]}</svg>${t[1]}</button>`).join('');
 const V={today:vToday,library:vLibrary,exercise:vExercise,plan:vPlan,builder:vBuilder,progress:vProgress,settings:vSettings};
 $('#view').innerHTML=(V[route.v]||vToday)(route.a);
 if(route.v==='progress')drawCharts();
}

/* ===================== VIEWS ===================== */
function vToday(){
 const p=plan();const idx=S.cursor%p.days.length;const d=p.days[idx];
 const wk=weekDates();const doneDates=new Set(S.sessions.map(s=>s.date));
 const strip=wk.map((x,i)=>{const k=dkey(x);const cls=[k===today()?'today':'',doneDates.has(k)?'done':''].join(' ');return `<div class="${cls}">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}<b>${x.getDate()}</b></div>`}).join('');
 const thisWeek=S.sessions.filter(s=>wk.some(x=>dkey(x)===s.date)).length;
 const trainDays=p.days.filter(x=>!x.rest).length;
 const list=d.slots.map(s=>{const e=EXI[s.ex];return `<button class="item" onclick="go('exercise',{id:'${e.id}'})"><img class="thumb" src="${exImg(e,0)||''}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><div class="grow"><div class="t">${esc(e.name)}</div><div class="d">${s.sets} × ${esc(s.reps)}${s.note?' · '+esc(s.note):''}</div></div></button>`}).join('');
 return `<div class="top"><div class="row" style="gap:10px">${brand(40,false)}<div><div class="small muted" style="line-height:1">FitLab</div><h1>Today</h1></div></div><small>${thisWeek}/${trainDays} sessions this week</small></div>
 <div class="week">${strip}</div>
 <div class="card"><div class="row between"><div><span class="pill ${d.rest?'n':''}">Day ${idx+1} of ${p.days.length}</span><h2 style="margin-top:6px">${esc(d.name)}</h2><p class="sub">${esc(d.focus||'')}</p></div></div>
 ${d.rest?`<p class="sub">${d.slots.length?'Light movement today.':'Full rest. Sleep, eat to target, walk if you like.'}</p>`:`<p class="sub">${d.slots.length} exercises · about ${Math.round(d.slots.reduce((a,s)=>a+s.sets*((EXI[s.ex]?.cls==='cardio')?15:1.5),0))} min</p>`}
 <div class="row" style="margin-top:10px;gap:8px">${d.slots.length?`<button class="btn blue" onclick="startGym(${idx})">Start ${d.rest?'session':'workout'}</button>`:''}<button class="btn ghost sm" onclick="skipDay()">Skip</button></div></div>
 <div class="list">${list}</div>
 ${S.sessions.length?`<h3 style="margin:18px 0 8px">Recent</h3><div class="list">${S.sessions.slice(-3).reverse().map(s=>`<div class="item"><div class="grow"><div class="t">${esc(s.dayName)}</div><div class="d">${s.date} · ${s.entries.reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0)} sets · ${s.min||0} min</div></div></div>`).join('')}</div>`:''}`;
}
function skipDay(){S.cursor=(S.cursor+1)%plan().days.length;save();render();toast('Moved to the next day');}

let libF={q:'',m:''};

function vPlan(){
 const p=plan();const au=audit(p);
 const days=p.days.map((d,i)=>`<div class="day"><h3>${esc(d.name)} <span class="pill ${d.rest?'n':''}">Day ${i+1}</span></h3><p class="small muted">${esc(d.focus||'')}</p>
  ${d.slots.map((s,j)=>{const e=EXI[s.ex];return `<div class="slot"><div class="sr">${s.sets}×${esc(s.reps)}</div><div class="grow"><a href="#" onclick="go('exercise',{id:'${e.id}'});return false"><b>${esc(e.name)}</b></a>${s.note?`<div class="why">${esc(s.note)}</div>`:''}${s.why?`<div class="why">${esc(s.why)}</div>`:''}</div><button class="btn ghost sm" style="padding:0 10px;min-height:36px" onclick="swapSlot(${i},${j})" aria-label="Swap exercise">⇄</button></div>`}).join('')}
  ${d.rest?'':`<div class="row" style="margin-top:8px"><button class="btn ghost sm" onclick="startGym(${i})">Start this day</button></div>`}</div>`).join('');
 const bars=au.map(r=>{const max=Math.max(r.hi*1.3,r.v+1);const col=r.st==='g'?'var(--green)':r.st==='a'?'var(--amber)':'var(--red)';return `<div class="bar"><span>${MUSCLES[r.m]}</span><div class="tr"><i style="width:${Math.min(100,r.v/max*100)}%;background:${col}"></i><span class="lo" style="left:${r.lo/max*100}%"></span><span class="hi" style="left:${r.hi/max*100}%"></span></div><span class="small" style="text-align:right">${r.v}<span class="muted">·${r.freq}×</span></span></div>`}).join('');
 const low=au.filter(r=>r.st==='r'&&r.lo>=6);const once=au.filter(r=>r.freq===1&&r.lo>=8);
 return `<div class="top"><h1>Plan</h1><small>${p.days.filter(d=>!d.rest).length} training days</small></div>
 <div class="card"><div class="row between"><div><h2>${esc(p.name)}</h2><p class="small muted">${S.plans.length} plan${S.plans.length>1?'s':''} saved</p></div></div>
 <div class="row" style="gap:8px;margin-top:8px"><button class="btn blue" onclick="go('builder')">Build a new plan</button>${S.plans.length>1?`<select onchange="S.activePlan=this.value;S.cursor=0;save();render()" style="width:auto">${S.plans.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}</div></div>
 <div class="card"><h3>Weekly volume check</h3><p class="small muted" style="margin:4px 0 10px">Hard sets per muscle per week (secondary muscles count half) and how many days each muscle is trained. Ticks show the growth range.</p>${bars}
 ${low.length?`<div class="watch" style="margin-top:10px"><b>Under the range:</b> ${low.map(r=>MUSCLES[r.m]).join(', ')}. Add a set or two, or accept it if these are not priorities.</div>`:''}
 ${once.length?`<div class="watch"><b>Trained once a week:</b> ${once.map(r=>MUSCLES[r.m]).join(', ')}. Twice a week grows a little better; a single hard day still works if recovery is the priority.</div>`:''}</div>
 ${days}
 <div class="row" style="gap:8px"><button class="btn ghost sm" onclick="exportPlan()">Share as text</button>${p.id!=='hollywood4'?`<button class="btn ghost sm" onclick="if(confirm('Delete this plan?')){S.plans=S.plans.filter(x=>x.id!==S.activePlan);S.activePlan=S.plans[0].id;S.cursor=0;save();render();}">Delete plan</button>`:''}</div>`;
}
function swapSlot(di,si){const p=plan();const s=p.days[di].slots[si];const e=EXI[s.ex];const opts=e.swaps.filter(x=>EXI[x.id]&&x.id!==e.id);if(!opts.length)return toast('No swap available');
 const pickd=prompt('Swap '+e.name+' for:\n'+opts.map((o,i)=>`${i+1}. ${EXI[o.id].name} (${o.reason})`).join('\n')+'\n\nType a number');const n=parseInt(pickd);if(!n||!opts[n-1])return;s.ex=opts[n-1].id;save();render();toast('Swapped');}
function exportPlan(){const p=plan();const t=p.name+'\n\n'+p.days.map((d,i)=>`Day ${i+1}: ${d.name}${d.focus?' ('+d.focus+')':''}\n`+(d.slots.map(s=>`- ${EXI[s.ex].name}: ${s.sets} x ${s.reps}${s.note?' ('+s.note+')':''}`).join('\n')||'- Rest')).join('\n\n');
 if(navigator.share)navigator.share({title:p.name,text:t}).catch(()=>{});else{navigator.clipboard?.writeText(t);toast('Copied to clipboard');}}

function vProgress(){
 const v=verdict();const exIds=[...new Set(S.sessions.flatMap(s=>s.entries.filter(en=>en.sets.some(x=>x.done&&x.w>0)).map(en=>en.ex)))];
 const sel=route.a?.ex||exIds[0];
 const wkSets=(n)=>{const a=Date.now()-n*7*864e5,b=Date.now()-(n-1)*7*864e5;return S.sessions.filter(s=>{const t=new Date(s.date);return t>a&&t<=b}).reduce((x,s)=>x+s.entries.reduce((y,en)=>y+en.sets.filter(z=>z.done).length,0),0)};
 const last=S.body.slice().sort((a,b)=>a.d<b.d?-1:1).slice(-1)[0];
 return `<div class="top"><h1>Progress</h1><small>${S.sessions.length} sessions logged</small></div>
 <div class="verdict ${v.cls}"><h3>${v.title}</h3><p class="sub" style="margin:4px 0 0">${v.text}</p></div>
 <div class="grid2"><div class="stat"><b>${wkSets(1)}</b><span>hard sets this week</span></div><div class="stat"><b>${wkSets(2)}</b><span>last week</span></div>
 ${last?`<div class="stat"><b>${last.w||'—'}</b><span>weight (${unit()}), ${last.d}</span></div><div class="stat"><b>${last.bf?last.bf+'%':'—'}</b><span>body fat</span></div>`:''}</div>
 <div class="card" style="margin-top:12px"><h3>Estimated 1RM</h3>${exIds.length?`<select onchange="route.a={ex:this.value};render()" style="margin:8px 0">${exIds.map(id=>`<option value="${id}" ${id===sel?'selected':''}>${esc(EXI[id]?.name||id)}</option>`).join('')}</select><canvas id="c1" data-ex="${sel}"></canvas>`:'<p class="muted">Log a few sessions with weight and reps to see strength trends.</p>'}</div>
 <div class="card"><h3>Body composition</h3>${S.body.length>=2?'<canvas id="c2"></canvas>':'<p class="muted">Import your FuelLog / Withings export in Settings to overlay weight and body fat here.</p>'}</div>
 <div class="card"><h3>Deload</h3><p class="sub">${S.lastDeload?`Last deload: ${S.lastDeload}.`:'No deload logged yet.'} Take one every 5–6 weeks or after two sessions where lifts regress: same weights, 40% fewer sets.</p><button class="btn ghost sm" onclick="S.lastDeload=today();save();render();toast('Deload week logged')">Log a deload week</button></div>`;
}
function drawCharts(){
 const c1=$('#c1');if(c1){const ex=c1.dataset.ex;const pts=[];S.sessions.forEach(s=>{const en=s.entries.find(e=>e.ex===ex);if(!en)return;const b=Math.max(0,...en.sets.filter(x=>x.done&&x.w>0).map(x=>e1rm(x.w,x.r)));if(b)pts.push({x:new Date(s.date).getTime(),y:b});});line(c1,[pts],['var(--blue)']);}
 const c2=$('#c2');if(c2){const b=S.body.slice().sort((a,c)=>a.d<c.d?-1:1);line(c2,[b.filter(x=>x.w).map(x=>({x:new Date(x.d).getTime(),y:x.w})),b.filter(x=>x.bf).map(x=>({x:new Date(x.d).getTime(),y:x.bf}))],['var(--ink)','var(--orange)'],true);}
}
function line(cv,series,colors,dual){
 const dpr=devicePixelRatio||1;const W=cv.clientWidth,H=180;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
 const cs=getComputedStyle(document.documentElement);const col=v=>v.startsWith('var(')?cs.getPropertyValue(v.slice(4,-1)).trim():v;
 const all=series.flat();if(!all.length)return;const xs=all.map(p=>p.x);const x0=Math.min(...xs),x1=Math.max(...xs)||x0+1;
 g.font='11px system-ui';g.fillStyle=col('var(--ink3)');
 series.forEach((pts,i)=>{if(!pts.length)return;const ys=pts.map(p=>p.y);let y0=Math.min(...ys),y1=Math.max(...ys);const pad=(y1-y0)*0.15||1;y0-=pad;y1+=pad;
  const X=x=>18+(x-x0)/(x1-x0||1)*(W-36),Y=y=>H-22-(y-y0)/(y1-y0)*(H-40);
  g.strokeStyle=col(colors[i]);g.lineWidth=2;g.beginPath();pts.forEach((p,j)=>j?g.lineTo(X(p.x),Y(p.y)):g.moveTo(X(p.x),Y(p.y)));g.stroke();
  g.fillStyle=col(colors[i]);pts.forEach(p=>{g.beginPath();g.arc(X(p.x),Y(p.y),3,0,7);g.fill();});
  g.fillStyle=col(colors[i]);g.textAlign=i?'right':'left';g.fillText(String(Math.round(ys[ys.length-1]*10)/10),i?W-4:4,12);});
 g.fillStyle=col('var(--ink3)');g.textAlign='left';g.fillText(new Date(x0).toLocaleDateString(),4,H-6);g.textAlign='right';g.fillText(new Date(x1).toLocaleDateString(),W-4,H-6);
}

 <div class="card"><div class="row" style="gap:14px;margin-bottom:10px">${brand(72,true)}<div><h3>FitLab</h3><p class="small muted" style="margin:0">Exercise coach, plan builder and workout log. Sister app to FuelLog.</p></div></div><p class="small sub">FitLab keeps everything on this device. Exercise images by free-exercise-db (public domain), loaded when online. Rest-timer notifications need permission: <button class="btn ghost sm" onclick="Notification?.requestPermission().then(p=>toast(p))">Allow</button></p>
 <button class="btn ghost sm" style="color:var(--red)" onclick="if(confirm('Delete all FitLab data on this device?')){localStorage.removeItem(KEY);location.reload()}">Reset app</button></div>`;
}
function importBody(f){if(!f)return;f.text().then(t=>{const rows=t.split(/\r?\n/).filter(Boolean).map(r=>r.split(/[,;\t]/));const h=rows[0].map(x=>x.toLowerCase().trim());const di=h.findIndex(x=>/date|fecha|day/.test(x)),wi=h.findIndex(x=>/weight|peso|kg/.test(x)),bi=h.findIndex(x=>/fat|grasa|bf/.test(x));
 if(di<0)return toast('No date column found');let n=0;rows.slice(1).forEach(r=>{const d=new Date(r[di]);if(isNaN(d))return;const k=dkey(d);const w=wi>=0?parseFloat(r[wi]):null,bf=bi>=0?parseFloat(r[bi]):null;if(!w&&!bf)return;const ex=S.body.find(x=>x.d===k);if(ex){if(w)ex.w=w;if(bf)ex.bf=bf;}else S.body.push({d:k,w:w||null,bf:bf||null});n++;});save();render();toast(n+' entries imported');});}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();}
function exportJSON(){dl('fitlab-backup-'+today()+'.json',JSON.stringify(S,null,1),'application/json');}
function exportCSV(){const rows=[['date','day','exercise','set','weight_'+unit(),'reps','rir','e1rm']];S.sessions.forEach(s=>s.entries.forEach(en=>en.sets.forEach((x,i)=>{if(x.done)rows.push([s.date,s.dayName,EXI[en.ex]?.name||en.ex,i+1,x.w,x.r,x.rir??'',e1rm(x.w,x.r)])})));dl('fitlab-sessions-'+today()+'.csv',rows.map(r=>r.join(',')).join('\n'),'text/csv');}
function importJSON(f){if(!f)return;f.text().then(t=>{try{const s=JSON.parse(t);if(!s.plans)throw 0;S=Object.assign({},DEF,s);save();render();toast('Backup restored');}catch(e){toast('Not a FitLab backup');}});}
function exportFlags(){const done=new Set(S.sessions.map(s=>s.date));const t=weekDates().map(d=>dkey(d)+','+(done.has(dkey(d))?'training':'rest')).join('\n');navigator.clipboard?.writeText('date,day_type\n'+t);toast('Copied');}

/* ===================== GYM MODE ===================== */
let G=null,T=null;
function startGym(di){const p=plan();const d=p.days[di];if(!d.slots.length)return;
 G={di,dayName:d.name,i:0,start:Date.now(),entries:d.slots.map(s=>{const e=EXI[s.ex];const sg=suggest(e,s);const n=s.sets;const sets=[...Array(n)].map((_,k)=>({w:sg.sets[k]?.w??sg.w??(e.cls==='cardio'?0:''),r:sg.sets[k]?.r??repLo(s.reps)??'',rir:2,done:false}));return {ex:s.ex,slot:s,sets,tip:sg.text};})};
 document.body.insertAdjacentHTML('beforeend','<div class="gym" id="gym"></div>');renderGym();
 try{navigator.wakeLock?.request('screen').then(l=>G.lock=l).catch(()=>{});}catch(e){}
}
function renderGym(){
 const en=G.entries[G.i];const e=EXI[en.ex];const s=en.slot;const n=G.entries.length;const isC=e.cls==='cardio';
 const hooks=S.jointMode&&/hook|strap/i.test(s.note||'')?'<span class="pill o">Hooks on</span>':'';
 const rows=en.sets.map((x,k)=>`<div class="setrow"><div class="n">${k+1}</div>
  ${isC?`<input type="text" value="${esc(x.w||s.reps)}" oninput="G.entries[${G.i}].sets[${k}].w=this.value" aria-label="Duration"><span class="small muted">RPE 4–5</span>`:
  `<div class="step"><button onclick="stepW(${k},-1)" aria-label="Less weight">−</button><input type="number" inputmode="decimal" value="${x.w}" placeholder="${unit()}" oninput="G.entries[${G.i}].sets[${k}].w=parseFloat(this.value)||0"><button onclick="stepW(${k},1)" aria-label="More weight">+</button></div>
   <div class="step"><button onclick="stepR(${k},-1)" aria-label="Fewer reps">−</button><input type="number" inputmode="numeric" value="${x.r}" placeholder="reps" oninput="G.entries[${G.i}].sets[${k}].r=parseInt(this.value)||0"><button onclick="stepR(${k},1)" aria-label="More reps">+</button></div>`}
  <button class="ok ${x.done?'done':''}" onclick="doneSet(${k})" aria-label="Log set">${x.done?'✓':'○'}</button></div>`).join('');
 $('#gym').innerHTML=`<div class="head"><button class="btn ghost sm" onclick="endGym(false)" aria-label="Close">✕</button><div class="grow"><div class="small muted">${esc(G.dayName)} · ${G.i+1}/${n}</div><div class="prog"><i style="width:${(G.i)/n*100}%"></i></div></div><button class="btn ghost sm" onclick="go('exercise',{id:'${e.id}'});endGym(false,true)" aria-label="How to">?</button></div>
 <div class="body">
  <div class="row between" style="align-items:flex-start"><div><h2>${esc(e.name)}</h2><p class="sub">${s.sets} × ${esc(s.reps)}${e.tempo?' · tempo '+e.tempo:''} ${hooks}</p></div>${e.img?`<img src="${exImg(e,0)}" alt="" style="width:72px;height:72px;border-radius:12px;object-fit:cover;background:var(--paper)" onerror="this.remove()">`:''}</div>
  <div class="suggest">${esc(en.tip)}</div>
  <ol class="cues" style="margin:6px 0 10px;font-size:15px">${e.cues.map(c=>`<li style="padding:6px 0">${esc(c)}</li>`).join('')}</ol>
  ${isC?'':`<div class="setrow small muted" style="margin-bottom:-2px"><div></div><div style="text-align:center">${unit()}</div><div style="text-align:center">reps</div><div></div></div>`}
  ${rows}
  <div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn ghost sm" onclick="addSet()">+ Set</button><button class="btn ghost sm" onclick="swapInGym()">Swap</button><button class="btn ghost sm" onclick="painCheck()">Pain?</button></div>
 </div>
 <div class="foot"><div class="inner"><div class="timer ${T?'go':''}" id="tm">${T?fmtT(T.left):'Rest '+REST[e.cls]+' s'}</div>
  <div class="row" style="gap:8px"><button class="btn ghost sm" onclick="prevEx()" ${G.i?'':'disabled'}>‹</button><button class="btn ${G.i===n-1?'orange':'blue'} grow" onclick="nextEx()">${G.i===n-1?'Finish':'Next'}</button><button class="btn ghost sm" onclick="T?stopT():startT(${REST[e.cls]||60})">${T?'Skip rest':'Rest'}</button></div></div></div>`;
}
function stepW(k,d){const en=G.entries[G.i];const e=EXI[en.ex];en.sets[k].w=Math.max(0,Math.round(((+en.sets[k].w||0)+d*(e.inc||2.5))*100)/100);renderGym();}
function stepR(k,d){const en=G.entries[G.i];en.sets[k].r=Math.max(0,(+en.sets[k].r||0)+d);renderGym();}
function doneSet(k){const en=G.entries[G.i];const x=en.sets[k];x.done=!x.done;const e=EXI[en.ex];
 if(x.done){if(navigator.vibrate)navigator.vibrate(30);if(k+1<en.sets.length&&!en.sets[k+1].done&&e.cls!=='cardio'){en.sets[k+1].w=en.sets[k+1].w||x.w;en.sets[k+1].r=en.sets[k+1].r||x.r;}if(e.cls!=='cardio')startT(REST[e.cls]);}
 renderGym();}
function addSet(){const en=G.entries[G.i];const l=en.sets[en.sets.length-1];en.sets.push({w:l?.w||'',r:l?.r||'',rir:2,done:false});renderGym();}
function prevEx(){G.i=Math.max(0,G.i-1);renderGym();}
function nextEx(){if(G.i===G.entries.length-1)return endGym(true);G.i++;stopT();renderGym();}
function swapInGym(){const en=G.entries[G.i];const e=EXI[en.ex];const opts=e.swaps.filter(x=>EXI[x.id]);if(!opts.length)return toast('No swap for this one');
 const n=parseInt(prompt('Machine busy? Swap '+e.name+' for:\n'+opts.map((o,i)=>`${i+1}. ${EXI[o.id].name} (${o.reason})`).join('\n')+'\n\nType a number'));if(!n||!opts[n-1])return;
 const ne=EXI[opts[n-1].id];const sg=suggest(ne,en.slot);en.ex=ne.id;en.tip=sg.text;en.sets=en.sets.map((x,k)=>({w:sg.sets[k]?.w??sg.w??'',r:x.r,rir:2,done:false}));renderGym();toast('Swapped for '+ne.name);}
function painCheck(){const en=G.entries[G.i];const e=EXI[en.ex];alert(e.name+'\n\nWatch out:\n• '+e.watch.join('\n• ')+'\n\nIf it is sharp or joint pain: stop the set, reduce the range or load, or use Swap. Never push through joint pain.');}
function endGym(saveIt,keepOpen){
 if(saveIt){const entries=G.entries.filter(en=>en.sets.some(x=>x.done)).map(en=>({ex:en.ex,sets:en.sets.filter(x=>x.done).map(x=>({w:+x.w||0,r:+x.r||0,rir:x.rir,done:true,dur:typeof x.w==='string'?x.w:undefined}))}));
  if(entries.length){S.sessions.push({date:today(),dayName:G.dayName,dayIdx:G.di,min:Math.round((Date.now()-G.start)/60000),entries});S.cursor=(G.di+1)%plan().days.length;save();toast('Workout saved');}}
 else if(!keepOpen&&G.entries.some(en=>en.sets.some(x=>x.done))&&!confirm('Leave without saving this workout?'))return;
 stopT();try{G.lock?.release()}catch(e){}G=null;$('#gym')?.remove();if(!keepOpen)render();
}
/* Rest timer with notification fallback for a locked screen */
const fmtT=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function startT(sec){stopT();T={end:Date.now()+sec*1000,left:sec};tick();T.iv=setInterval(tick,250);
 if('Notification' in window&&Notification.permission==='granted'){T.nt=setTimeout(()=>{try{new Notification('Rest over',{body:'Next set',silent:false})}catch(e){}},sec*1000);}}
function tick(){if(!T)return;const l=Math.max(0,Math.ceil((T.end-Date.now())/1000));if(l!==T.left){T.left=l;const el=$('#tm');if(el)el.textContent=fmtT(l);if(l===0){if(navigator.vibrate)navigator.vibrate([200,100,200]);stopT();toast('Rest over');}}}
function stopT(){if(T){clearInterval(T.iv);clearTimeout(T.nt);T=null;const el=$('#tm');if(el&&G){el.textContent='Rest '+REST[EXI[G.entries[G.i].ex].cls]+' s';el.classList.remove('go');}}}

/* Install prompt (Android/desktop); iOS uses Share > Add to Home Screen */
let installEvt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(route.v==='settings')render();});
function installApp(){if(installEvt){installEvt.prompt();installEvt.userChoice.then(()=>{installEvt=null;render();});}}
/* ===================== BOOT ===================== */
window.addEventListener('popstate',()=>{if(route.v==='exercise'||route.v==='builder'){route={v:route.v==='builder'?'plan':'library'};render();}});
const _go=go;go=function(v,a){if(v==='exercise'||v==='builder')history.pushState({v},'');_go(v,a);};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
